<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建账户 - 扶九API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 10%, rgba(20,184,166,.14), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(240,169,59,.12), transparent 45%),
                linear-gradient(145deg, #f0fdfa 0%, #f8fafc 55%, #fff7ed 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand img { width: 62px; height: 62px; filter: drop-shadow(0 8px 18px rgba(15,118,110,.3)); }
        .brand h1 { font-size: 25px; font-weight: 900; color: #0f766e; letter-spacing: 2px; margin-top: 8px; }
        .brand p { color: #64748b; font-size: 14px; margin-top: 4px; }

        .card {
            background: #fff;
            border: 1px solid rgba(15,118,110,.16);
            border-radius: 20px;
            box-shadow: 0 22px 50px rgba(15,118,110,.14);
            max-width: 560px;
            width: 100%;
            overflow: hidden;
        }
        .card-head {
            display: flex; align-items: center; gap: 14px;
            padding: 22px 26px 16px;
        }
        .card-head .icon {
            width: 46px; height: 46px; flex: none;
            background: linear-gradient(135deg, rgba(15,118,110,.1), rgba(20,184,166,.08));
            border: 1px solid rgba(15,118,110,.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .card-head h2 { font-size: 17.5px; color: #134e4a; font-weight: 800; }
        .date {
            display: inline-block; margin-top: 3px;
            background: #f1f5f9; color: #64748b;
            font-size: 12px; font-weight: 600;
            padding: 2px 10px; border-radius: 999px;
        }
        .card-desc { padding: 0 26px 18px; color: #475569; font-size: 14.5px; line-height: 1.8; }
        .card-desc b { color: #0f766e; }

        .docs-title { padding: 0 26px 10px; font-size: 14px; font-weight: 800; color: #334155; }
        .docs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding: 0 26px 22px;
        }
        .docs a {
            display: flex; align-items: center; gap: 10px;
            border: 1px solid rgba(15,118,110,.18);
            background: #fff;
            border-radius: 12px;
            padding: 13px 14px;
            text-decoration: none;
            color: #1f2937; font-size: 14.5px; font-weight: 600;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .docs a:hover { border-color: #14b8a6; box-shadow: 0 6px 16px rgba(15,118,110,.12); }
        .docs a .doc-icon {
            width: 34px; height: 34px; flex: none;
            background: rgba(15,118,110,.07);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
        }
        .docs a .arrow { margin-left: auto; color: #94a3b8; font-size: 13px; }

        .actions {
            display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px;
            padding: 18px 26px 24px;
            background: linear-gradient(180deg, rgba(15,118,110,.04), rgba(15,118,110,.08));
            border-top: 1px solid rgba(15,118,110,.1);
        }
        .btn {
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            font-size: 15.5px; font-weight: 800;
            padding: 14px 10px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-reject { background: #fff; color: #64748b; border: 1px solid #e2e8f0; }
        .btn-reject:hover { color: #ef4444; border-color: #fecaca; }
        .btn-agree {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            box-shadow: 0 10px 24px rgba(234,88,12,.35);
        }
        .btn-agree:hover { filter: brightness(1.06); }
        .btn-agree:active { filter: brightness(.96); }

        .foot { margin-top: 18px; color: #94a3b8; font-size: 13px; }
        .foot a { color: #0f766e; font-weight: 700; text-decoration: none; }
        @media (max-width: 480px) { .docs { grid-template-columns: 1fr; } .actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="brand">
        <img src="img/logo.svg" alt="扶九API">
        <h1>扶九API</h1>
        <p>一个 API Key，连接全球顶尖大模型。</p>
    </div>

    <div class="card">
        <div class="card-head">
            <div class="icon">📖</div>
            <div>
                <h2>条款更新通知</h2>
                <span class="date">2026-09-10</span>
            </div>
        </div>
        <p class="card-desc">
            我们的服务条款已于 <b>2026-09-10</b> 更新。在创建账户之前，请仔细阅读并同意以下条款。
            点击「同意并继续」后将进入注册页面。
        </p>

        <p class="docs-title">相关文档</p>
        <div class="docs">
            <a href="legal.html#terms" target="_blank" rel="noopener"><span class="doc-icon">📄</span>服务条款<span class="arrow">↗</span></a>
            <a href="legal.html#usage" target="_blank" rel="noopener"><span class="doc-icon">🛡️</span>使用政策<span class="arrow">↗</span></a>
            <a href="legal.html#regions" target="_blank" rel="noopener"><span class="doc-icon">🌍</span>支持的国家和地区<span class="arrow">↗</span></a>
            <a href="legal.html#service" target="_blank" rel="noopener"><span class="doc-icon">⚙️</span>服务特定条款<span class="arrow">↗</span></a>
        </div>

        <div class="actions">
            <a class="btn btn-reject" href="https://fujiuapi.com">拒绝</a>
            <button class="btn btn-agree" onclick="agreeAndContinue()" id="agreeBtn">✅ 同意并继续</button>
        </div>
    </div>

    <p class="foot">已有账户？<a href="https://fujiuapi.com/sign-in" target="_blank" rel="noopener">直接登录</a>　|　<a href="https://fujiuapi.com" target="_blank" rel="noopener">返回首页</a></p>

    <script>
        // 条款版本号：每次更新条款后改这里 + 上方日期，老用户需重新同意
        var TERMS_VERSION = '2026-09-10';
        var SIGNUP_URL = 'https://fujiuapi.com/sign-up';

        // 已同意过当前版本的用户：直接放行进入注册页，不再重复弹
        try {
            if (localStorage.getItem('fj_terms_agreed') === TERMS_VERSION) {
                location.replace(SIGNUP_URL);
            }
        } catch (e) { /* 隐私模式等场景下忽略，正常展示条款 */ }

        function agreeAndContinue() {
            var btn = document.getElementById('agreeBtn');
            btn.textContent = '正在进入注册…';
            try { localStorage.setItem('fj_terms_agreed', TERMS_VERSION); } catch (e) {}
            location.href = SIGNUP_URL;
        }
    </script>
</body>
</html>
